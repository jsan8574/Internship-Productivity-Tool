<title>Verify Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: CRM-style shell — deep-teal sidebar, warm off-white work canvas, white work cards; KB is a right slide-over reachable from anywhere. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0f1ee; --line:#e3e6e2; --line-strong:#cfd6d2;
  --fg:#12302f; --muted:#5f6f6c; --faint:#8a9895;
  --side:#164a4b; --side-2:#1f5a5b; --side-fg:#d9e7e4; --side-muted:#8fb0ab;
  --hero:#e4f1ee; --hero-fg:#12302f; --hero-line:#c9e2dc;
  --teal:#2a7a7f; --green:#59a67d; --accent:#23767b; --accent-soft:#e2f0ee; --accent-fg:#ffffff;
  --grad:linear-gradient(90deg,#2a7a7f,#59a67d);
  --orange:#e08a2b; --orange-soft:#fbeedd;
  --good:#2f8a5b; --good-soft:#e2f3e9; --warn:#b97512; --warn-soft:#fcf0dc; --bad:#c2453b; --bad-soft:#fbe6e3; --info:#2d6f9a; --info-soft:#e3eff7;
  --shadow:0 1px 2px rgba(18,48,47,.05),0 6px 18px rgba(18,48,47,.06);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,2.6vw,2.1rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{font:600 .72rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{background:var(--surface);display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.brand-mark{font:800 1.3rem/1 var(--f-display);white-space:nowrap;color:var(--side);letter-spacing:-.04em;position:relative}
.brand-mark::after{content:"";position:absolute;left:2px;right:-2px;bottom:-5px;height:3px;border-radius:3px;background:var(--grad)}
.brand-name{font:600 .72rem/1.25 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.nav{padding:18px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font:600 .72rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);padding:16px 12px 8px}
.nav-label:first-child{padding-top:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--side-fg);font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.85}
.nav button:hover{background:var(--side-2)}
.nav button.on{background:var(--side-2);box-shadow:inset 3px 0 0 var(--green)}
.nav button:focus-visible{outline:2px solid var(--green)}
.nav .count{margin-left:auto;background:var(--orange);color:#fff;font-size:.72rem;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px}
.mode-switch{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;cursor:pointer}
.mode-switch b{font-weight:600}
.mode-switch small{display:block;color:var(--side-muted);font-size:.78rem;line-height:1.3}
.toggle{position:relative;width:38px;height:22px;flex:none;border-radius:11px;background:rgba(255,255,255,.2);transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(16px)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.me-name{font-weight:600;line-height:1.2}
.me-sub{font-size:.8rem;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.role-pick{display:flex;gap:6px}
.role-pick button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:.8rem;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.18)}
.role-pick button.on{background:var(--side-2);border-color:var(--green)}

.main{min-width:0;padding-inline:clamp(16px,3.2vw,48px);padding-block:32px 80px}
.topbar{display:none}
.demo-banner{display:flex;gap:10px;align-items:center;background:var(--orange-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--orange) 35%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:22px;font-size:.9rem}
.demo-banner b{color:var(--orange)}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.page-head p{color:var(--muted);margin-top:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 4px 14px rgba(42,122,127,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.78rem;color:var(--faint)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;min-height:40px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 16px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg button.on.no{background:var(--bad);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--fg)}
.tabs button.on{background:var(--grad);color:#fff}
.tabs button .n{font-weight:500;opacity:.7;margin-left:4px}

/* Cards / tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:24px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 0;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:16px;margin-bottom:26px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.tile .eyebrow{margin-bottom:14px}
.tile .num{font:800 2.3rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .sub{font-size:.85rem;color:var(--muted);margin-top:10px}
.tile.hero{background:var(--hero);color:var(--hero-fg);border-color:var(--hero-line)}
.tile.hero .eyebrow,.tile.hero .sub{color:var(--accent)}
.tile.hero .num{font-size:3rem}
.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}

/* Bars (pipeline-at-a-glance style) */
.bars{display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px}
.bar-row{display:grid;grid-template-columns:minmax(110px,180px) 1fr 44px;align-items:center;gap:14px}
.bar-row .lab{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--grad);border-radius:5px;min-width:2px}
.bar-row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.pname{font-weight:600}
.psub{font-size:.82rem;color:var(--muted)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.plain::before{display:none}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* Workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.pt-card{background:var(--hero);color:var(--hero-fg);border:1px solid var(--hero-line);border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:20px}
.pt-card .eyebrow{color:var(--accent);margin-bottom:6px}
.pt-card .val{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.pt-card .val.big{font:700 1.3rem/1.2 var(--f-display)}
.stepper{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.stepper button .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.75rem;font-variant-numeric:tabular-nums}
.stepper button.on{border-color:var(--accent);color:var(--fg)}
.stepper button.on .dot{background:var(--accent);color:var(--accent-fg)}
.stepper button.done .dot{background:var(--good-soft);color:var(--good)}
.step-card{padding:26px}
.step-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap}
.step-goal{color:var(--muted);margin-bottom:18px;max-width:68ch}
.guide{border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-soft);border-radius:12px;padding:16px 18px;margin-bottom:20px}
.guide-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.guide-head b{font-family:var(--f-display);color:var(--accent);font-size:.92rem;display:flex;gap:8px;align-items:center}
.guide-head svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.guide ol,.guide ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide .why{font-size:.9rem;color:var(--muted);margin-top:10px}
.guide .kb-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.guide-collapsed{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--line-strong);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:.88rem;color:var(--muted)}
.checklist{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.checklist .eyebrow{margin-bottom:8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer}
.check:hover{background:var(--surface-2)}
.check input{appearance:none;width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;flex:none;margin-top:1px;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.check input:checked{background:var(--good);border-color:var(--good)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.fields .full{grid-column:1/-1}
.step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.suggest{border-radius:12px;padding:16px 18px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.suggest .s-status{font:800 1.25rem/1.2 var(--f-display)}
.suggest.good{background:var(--good-soft);border-color:transparent}
.suggest.good .s-status{color:var(--good)}
.suggest.bad{background:var(--bad-soft);border-color:transparent}
.suggest.bad .s-status{color:var(--bad)}
.suggest.warn{background:var(--warn-soft);border-color:transparent}
.suggest.warn .s-status{color:var(--warn)}
.note-box{font-family:var(--f-mono);font-size:.82rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.aside-stack{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.aside-stack .card{padding:18px 20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.qa-flag{background:var(--bad-soft);color:var(--fg);border-radius:12px;padding:14px 16px;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.qa-flag b{color:var(--bad)}

/* Upload */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:30px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6;margin-bottom:6px}
.assign-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:18px 24px;border-bottom:1px solid var(--line)}
.intern-chips{display:flex;flex-wrap:wrap;gap:6px}
.row-bad td{background:var(--bad-soft)}

/* Progress */
.milestones{display:flex;flex-direction:column;gap:14px}
.ms{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.ms .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.8rem}
.ms.done .ico{background:var(--good-soft);color:var(--good)}
.ms .track{margin-top:6px}

/* KB drawer */
.scrim{position:fixed;inset:0;background:rgba(6,20,20,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.kb{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.kb.on{transform:none}
.kb-head{padding:20px 24px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.kb-head-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kb-search{position:relative}
.kb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.kb-search .input{padding-left:38px}
.kb-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.kb-cats .chip{white-space:nowrap}
.kb-body{flex:1;overflow-y:auto;padding:20px 24px 40px}
.kb-list{display:flex;flex-direction:column;gap:8px}
.kb-item{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kb-item:hover{border-color:var(--accent)}
.kb-item b{font-family:var(--f-display);display:block;margin-bottom:2px}
.kb-item span{font-size:.86rem;color:var(--muted)}
.kb-item:focus-visible{outline:2px solid var(--accent)}
.kb-article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;max-width:72ch}
.kb-article h2{margin-bottom:6px}
.kb-article h4{font-size:.95rem;margin:20px 0 6px}
.kb-article p,.kb-article li{color:var(--fg)}
.kb-article p+p{margin-top:10px}
.kb-article ul,.kb-article ol{padding-left:20px;display:flex;flex-direction:column;gap:5px;margin:8px 0}
.kb-article table{margin:10px 0;font-size:.85rem}
.kb-article th,.kb-article td{padding:8px 10px;border:1px solid var(--line)}
.kb-article .callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:.92rem}
.kb-article .callout.warn{background:var(--warn-soft)}
.kb-article .team{background:var(--orange-soft);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.88rem}
.kb-article dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px 16px;margin:10px 0}
.kb-article dt{font-weight:700}
.kb-article dd{margin:0;color:var(--fg)}
.kb-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(14,52,53,.35)}
.kb-fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1px 5px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--side);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.9rem}
.loading{padding:60px;text-align:center;color:var(--muted)}
.spacer{height:20px}

{id:'what-is-ibv',cat:'Start here',title:'What insurance verification is (and why it matters)',summary:'Eligibility vs. benefits, and what happens when we get it wrong.',tags:'eligibility benefits ibv basics purpose denial',body:`
<p><b>Eligibility verification</b> answers: <i>does this patient have active coverage with this payer on the date of service?</i></p>
<p><b>Benefits verification</b> goes further: <i>what does the plan cover for this specific service, with this provider, and what will the patient owe?</i></p>
<div class="callout">Every verification you complete decides whether a provider sees the patient, so it directly protects the clinic from denied claims and protects the patient from surprise bills.</div>
<h4>What a complete verification confirms</h4>
<ol><li>The right patient (name + DOB match exactly)</li><li>The policy is active on the DOS</li><li>The rendering provider is in network (contracted) with that plan</li><li>The patient is not on hospice (or the hospice rule is applied)</li><li>The service is covered and frequency limits are met</li><li>An approval status is chosen using the Decision Matrix</li><li>TEBRA is updated: case name, verification note, alerts</li></ol>
<h4>Top reasons claims deny for eligibility</h4>
<ul><li>Coverage terminated before the DOS</li><li>Wrong payer or plan on file (e.g., Medicare on file but patient switched to a Medicare Advantage plan)</li><li>Provider out of network for that specific plan</li><li>Frequency limit exceeded (e.g., AWV billed within 12 months of the last one)</li><li>Patient elected hospice</li></ul>`},

{id:'shift-checklist',cat:'Start here',title:'Start-of-shift checklist',summary:'Five things to do before your first account.',tags:'checklist shift start daily routine',body:`
<ol><li>Open the Verify Desk and check <b>My Queue</b> for today's accounts and any <b>Returned by QA</b> items. Fix returns first.</li>
<li>Log in to TEBRA and to the payer portals you use most. Keep them open in tabs.</li>
<li>Have the Decision Matrix open (Knowledge Base &gt; Decision-making).</li>
<li>Work oldest-first. Unfinished accounts from yesterday carry over to today's queue.</li>
<li>When you are stuck for more than 10 minutes on one account, mark it <b>Escalate</b> with a clear comment and move on.</li></ol>
<div class="team">Team rule: confirm with your manager the daily target and the cut-off time for submitting.</div>`},

{id:'decision-matrix',cat:'Decision-making',title:'The Decision Matrix',summary:'How each approval status is reached. The tool suggests one; you confirm it.',tags:'decision matrix approval status rules good to schedule out of network group billing self pay',body:`
<p>This is the Decision Matrix from the verification template. Read across a row: when every condition matches, that row's status applies. <b>N/A</b> means the condition does not affect the outcome.</p>
<div class="table-wrap"><table><thead><tr><th>Approval status</th><th>Policy active</th><th>Provider INN</th><th>Hospice</th><th>Group billing allowed</th><th>Self-pay agreement signed</th></tr></thead><tbody>
<tr><td><b>Good to Schedule</b></td><td>Yes</td><td>Yes</td><td>No</td><td>N/A</td><td>N/A</td></tr>
<tr><td><b>Provider out of Network</b></td><td>Yes</td><td>No</td><td>No</td><td>N/A</td><td>N/A</td></tr>
<tr><td><b>Ok for Group Billing</b></td><td>Yes</td><td>No</td><td>Yes</td><td>Yes</td><td>N/A</td></tr>
<tr><td><b>Deceased</b></td><td colspan="5">Applies regardless of other answers</td></tr>
<tr><td><b>Policy Not Active</b></td><td>No</td><td>N/A</td><td>N/A</td><td>N/A</td><td>No</td></tr>
<tr><td><b>Approved for Self Pay</b></td><td>No</td><td>N/A</td><td>N/A</td><td>N/A</td><td>Yes</td></tr>
<tr><td><b>No self pay agreement</b></td><td>No</td><td>N/A</td><td>N/A</td><td>N/A</td><td>No</td></tr>
<tr><td><b>Frequency Requirement Not Met</b></td><td colspan="5">Applies when the service's frequency limit is not met</td></tr>
</tbody></table></div>
<h4>Order the tool checks in</h4>
<ol><li>Deceased → <b>Deceased</b></li><li>Patient inactive in TEBRA → <b>TEBRA INACTIVE</b></li><li>Policy not active → self-pay branch</li><li>Frequency not met → <b>Frequency Requirement Not Met</b></li><li>TCM service not covered → <b>No TCM Coverage</b></li><li>Network + hospice + group billing → the matching row</li><li>Nothing matches → <b>ON HOLD</b> and escalate</li></ol>
<div class="team">Team rule to confirm: "Policy Not Active" and "No self pay agreement" share the same conditions in the matrix. The tool uses <b>No self pay agreement</b> when a self-pay agreement was requested and is not signed, and <b>Policy Not Active</b> when self-pay has not been discussed yet.</div>`},

{id:'statuses',cat:'Decision-making',title:'Approval status definitions',summary:'What each of the 11 statuses means and when to use it.',tags:'approval status definitions on hold tebra inactive tcm deceased',body:`
<dl>
<dt>Good to Schedule</dt><dd>Active policy, provider in network, patient not in hospice. The visit can be booked.</dd>
<dt>Provider out of Network</dt><dd>Active policy, but the rendering provider is not contracted with this plan, and no exception applies.</dd>
<dt>Ok for Group Billing</dt><dd>Provider is not individually in network, but the payer allows the service to be billed under the group, per the matrix conditions.</dd>
<dt>Policy Not Active</dt><dd>No active coverage on the DOS, and self-pay has not been arranged.</dd>
<dt>Approved for Self Pay</dt><dd>No active coverage, but the patient signed a self-pay agreement.</dd>
<dt>No self pay agreement</dt><dd>No active coverage, and a self-pay agreement was requested but is not signed.</dd>
<dt>Deceased</dt><dd>The payer response, TEBRA, or the practice shows a date of death.</dd>
<dt>Frequency Requirement Not Met</dt><dd>The service was already performed within its allowed frequency window (e.g., AWV in the last 12 months).</dd>
<dt>TEBRA INACTIVE</dt><dd>The patient record is inactive in TEBRA. Do not verify further; flag it.</dd>
<dt>No TCM Coverage</dt><dd>The service is Transitional Care Management and the plan does not cover it (or another provider already billed TCM for this discharge).</dd>
<dt>ON HOLD</dt><dd>You cannot finish: conflicting information, payer unreachable, or no matrix rule fits. Always add a comment saying what is missing.</dd>
</dl>`},

{id:'when-escalate',cat:'Decision-making',title:'When to escalate vs. decide yourself',summary:'Clear lines for when a case goes to your manager.',tags:'escalate on hold manager stuck unsure',body:`
<h4>Decide yourself</h4><ul><li>The answers match one row of the Decision Matrix</li><li>TEBRA eligibility and the payer portal agree</li></ul>
<h4>Escalate (mark ON HOLD + Escalate)</h4><ul><li>TEBRA and the payer portal disagree, and a call did not resolve it</li><li>The patient has two active policies and you cannot tell which is primary</li><li>Hospice is Yes but no matrix row fits</li><li>The payer rep gives an answer that contradicts the portal</li><li>You spent more than 10 minutes and are not closer to an answer</li></ul>
<div class="callout">A good escalation comment says what you checked, what you found, and what is unclear. Example: <i>"TEBRA 271 shows active, Availity shows term 08/31. Called Humana, 25-min hold, disconnected. Need guidance on which to trust."</i></div>`},

{id:'sources',cat:'Workflow',title:'Where to verify: TEBRA, portal, or call',summary:'Start fast, escalate to slower sources only when needed.',tags:'tebra portal call availity source workflow order',body:`
<ol><li><b>TEBRA eligibility check</b> (fastest). Run it on the patient's policy. It sends an electronic 270 inquiry and returns a 271 response.</li>
<li><b>Payer website / portal</b> when the 271 is missing details, shows an error, or does not show network status or hospice. Many payers use Availity; others have their own portals.</li>
<li><b>Call the payer</b> when the portal cannot answer, or the answers conflict. Always record the rep's name and a call reference number.</li></ol>
<div class="callout warn">A 271 that says "active" does not confirm the provider is in network. Network status usually needs the portal, the practice's contract list, or a call.</div>`},

{id:'eligibility-271',cat:'Workflow',title:'Reading an eligibility (271) response',summary:'Which fields to look at and the traps to avoid.',tags:'271 270 eligibility response effective termination date active coverage',body:`
<h4>Look for</h4><ul><li><b>Coverage status</b>: Active / Inactive</li><li><b>Effective date</b> and <b>termination date</b>: the DOS must fall between them</li><li><b>Plan name and type</b> (HMO, PPO, Medicare Advantage, Medicaid)</li><li><b>Other payer / COB</b> info that may make this plan secondary</li><li><b>Hospice</b> or <b>Medicare Advantage</b> segments on Medicare responses</li></ul>
<h4>Traps</h4><ul><li>Checking today's date instead of the DOS</li><li>Treating a Medicare "active" response as final when the patient has a Medicare Advantage plan listed: the MA plan is the payer to verify</li><li>Name or DOB mismatches: re-run with the exact spelling on the card</li></ul>`},

{id:'payer-call',cat:'Workflow',title:'Payer call script',summary:'What to have ready, what to ask, and what to write down.',tags:'call script payer phone rep reference questions',body:`
<h4>Have ready</h4><ul><li>Provider name, NPI, and Tax ID</li><li>Patient name, DOB, member ID</li><li>Date of service and type of service (CPT if known)</li></ul>
<h4>Ask</h4><ol><li>"Is the policy active for date of service ___?" (get effective/term dates)</li><li>"Is Dr. ___, NPI ___, in network for this member's plan?"</li><li>"Is there a hospice election on file?"</li><li>"Is [service] covered? Any frequency limit, and when was it last billed?"</li><li>"Is a referral or prior authorization required?"</li><li>"What is the patient's copay / coinsurance / remaining deductible?"</li></ol>
<h4>Before you hang up</h4><p>Get the <b>rep's name</b> and a <b>call reference number</b>. Enter both in the Reference field.</p>
<div class="callout">HIPAA minimum necessary: share only the patient details needed to identify the member.</div>`},

{id:'network',cat:'Workflow',title:'Checking network (contracted) status',summary:'INN vs. OON, and why "the payer" is not enough.',tags:'network contracted inn oon in network out of network credentialing npi',body:`
<p>A provider can be in network with a payer's PPO but not its HMO, or with commercial plans but not Medicare Advantage. Always check the <b>specific plan</b>.</p>
<ul><li>Use the rendering provider's individual NPI (Type 1) and the group's NPI/Tax ID (Type 2)</li><li>Check the payer's provider directory or portal, or call</li><li>Credentialing in progress is <b>not</b> in network</li></ul>
<div class="team">Team rule: ask your manager for the practice's current contracted-plans list per provider. The QA team has flagged cases like "provider is credentialed under the group" as considerations, so check both individual and group.</div>`},

{id:'hospice',cat:'Workflow',title:'Hospice check',summary:'Why hospice changes everything, and how to find it.',tags:'hospice election medicare alert benefit period',body:`
<p>When a Medicare patient elects hospice, the hospice is responsible for care related to the terminal illness. Visits by other providers may not be payable unless they are unrelated to the terminal condition or the provider is the patient's designated attending physician.</p>
<h4>How to check</h4><ul><li>Medicare eligibility responses show hospice election periods (start date, hospice provider)</li><li>For Medicare Advantage members, still check Medicare: hospice is generally billed to Original Medicare even for MA members</li><li>If the portal is unclear, call</li></ul>
<h4>If hospice = Yes</h4><ul><li>Note the hospice start date and hospice name in your comment</li><li>Update the <b>hospice alert</b> in TEBRA. This is one of the most common QA fails.</li><li>Apply the Decision Matrix (group billing row) or escalate</li></ul>`},

{id:'cob',cat:'Payers & plans',title:'Primary vs. secondary (coordination of benefits)',summary:'Which plan pays first.',tags:'cob coordination primary secondary medicare secondary payer msp',body:`
<ul><li>The <b>primary</b> payer pays first; the <b>secondary</b> pays some of what is left.</li><li>Medicare is usually primary for patients 65+ who are retired.</li><li>If a patient 65+ has group health coverage through their own or their spouse's <b>current</b> employment with 20+ employees, the employer plan is usually primary and Medicare secondary.</li><li>Medicaid is almost always the payer of last resort (secondary).</li></ul>
<p>Verify the <b>primary</b> plan in this tool. Mention a secondary plan in the comment.</p>`},

{id:'plan-types',cat:'Payers & plans',title:'Plan types at a glance',summary:'HMO, PPO, EPO, POS, Medicare, MA, Medigap, Medicaid.',tags:'hmo ppo epo pos medicare advantage medigap medicaid dsnp plan types',body:`
<div class="table-wrap"><table><thead><tr><th>Plan</th><th>Network rules</th><th>Watch for</th></tr></thead><tbody>
<tr><td><b>HMO</b></td><td>In network only (except emergencies)</td><td>PCP assignment, referrals</td></tr>
<tr><td><b>PPO</b></td><td>Out of network allowed at higher cost</td><td>Separate OON deductible</td></tr>
<tr><td><b>EPO</b></td><td>In network only, usually no referral</td><td>OON not covered</td></tr>
<tr><td><b>POS</b></td><td>Hybrid; PCP and referrals for best rate</td><td>Referral rules</td></tr>
<tr><td><b>Original Medicare</b> (Parts A &amp; B)</td><td>Any provider that accepts Medicare</td><td>MBI number, frequency limits</td></tr>
<tr><td><b>Medicare Advantage</b> (Part C)</td><td>Private plan replaces Original Medicare; HMO/PPO networks</td><td>Verify with the MA plan, not Medicare</td></tr>
<tr><td><b>Medigap</b> (supplement)</td><td>Pays after Original Medicare</td><td>Secondary only; not an MA plan</td></tr>
<tr><td><b>Medicaid / Managed Medicaid</b></td><td>State program, often via MCOs</td><td>Payer of last resort; monthly eligibility</td></tr>
<tr><td><b>D-SNP</b></td><td>MA plan for dual-eligible (Medicare + Medicaid)</td><td>Both coverages apply</td></tr>
</tbody></table></div>`},

{id:'cost-share',cat:'Payers & plans',title:'Deductible, copay, coinsurance, out-of-pocket max',summary:'What the patient owes, in plain terms.',tags:'deductible copay coinsurance oop out of pocket maximum allowed amount',body:`
<dl><dt>Allowed amount</dt><dd>The maximum the plan pays an in-network provider for a service.</dd>
<dt>Deductible</dt><dd>What the patient pays each plan year before the plan starts paying.</dd>
<dt>Copay</dt><dd>A fixed amount per visit (e.g., $25).</dd>
<dt>Coinsurance</dt><dd>A percentage of the allowed amount the patient pays after the deductible (e.g., 20%).</dd>
<dt>Out-of-pocket max</dt><dd>Once reached, the plan pays 100% of covered services for the rest of the plan year.</dd></dl>
<div class="callout">Example: allowed amount $200, deductible met, 20% coinsurance → patient owes $40, plan pays $160.</div>`},

{id:'svc-awv',cat:'Services',title:'Annual Wellness Visit (AWV) and IPPE',summary:'Frequency rules that cause the most denials.',tags:'awv annual wellness visit ippe welcome to medicare g0438 g0439 g0402 frequency',body:`
<ul><li><b>IPPE</b> ("Welcome to Medicare", G0402): once, within the first 12 months of Part B.</li><li><b>Initial AWV</b> (G0438): once, after the first 12 months of Part B, and not within 12 months of an IPPE.</li><li><b>Subsequent AWV</b> (G0439): once every 12 months (11 full months must pass after the last one).</li></ul>
<p>Check the last AWV date in the portal (often shown as "preventive services eligibility"). If it is too soon → <b>Frequency Requirement Not Met</b>.</p>`},

{id:'svc-tcm',cat:'Services',title:'Transitional Care Management (TCM)',summary:'Post-discharge care: timing rules and coverage.',tags:'tcm transitional care management 99495 99496 discharge',body:`
<ul><li>CPT <b>99495</b> (moderate complexity, face-to-face visit within 14 days) and <b>99496</b> (high complexity, within 7 days).</li><li>Interactive contact with the patient within 2 business days of discharge.</li><li>Covers a 30-day period starting on the discharge date. Only one provider can bill TCM for that period.</li></ul>
<p>If the plan does not cover TCM, or another provider already billed it for this discharge → <b>No TCM Coverage</b>.</p>`},

{id:'svc-other',cat:'Services',title:'Other common service types',summary:'CCM, RPM, office visits, telehealth.',tags:'ccm chronic care management rpm remote patient monitoring telehealth office visit e/m',body:`
<dl><dt>CCM (Chronic Care Mgmt)</dt><dd>Monthly care management for patients with 2+ chronic conditions. Needs patient consent; check that no other provider bills CCM the same month.</dd>
<dt>RPM (Remote Monitoring)</dt><dd>Device-based monitoring billed monthly. Check plan coverage, especially for commercial plans.</dd>
<dt>Office / home visit (E/M)</dt><dd>Standard visit. Check copay and whether a referral is needed (HMO).</dd>
<dt>Telehealth</dt><dd>Coverage varies by payer and plan. Confirm telehealth is covered for this service.</dd></dl>
<div class="team">Team rule: ask your manager for the full list of service types your team verifies and any payer-specific rules.</div>`},

{id:'note-format',cat:'Documentation',title:'TEBRA documentation: case name, note, alerts',summary:'The three updates QA checks on every account.',tags:'notes documentation case name alert vac qa tebra update',body:`
<ol><li><b>Case name</b>: update it so it reflects the current verified plan.</li><li><b>Verification note</b>: paste the note the tool generates (Step 8 has a Copy button). It includes date, source, plan, member ID, eligibility, network, hospice, reference, and status.</li><li><b>Alerts</b>: if the patient is in hospice, update the hospice alert.</li></ol>
<div class="callout warn">The most frequent QA findings in this program are "Notes not updated (VAC)" and "Pt hospice alert not updated". Do all three updates in TEBRA <i>before</i> you tick them here.</div>
<div class="team">Team rule: replace the note template in Step 8 with your team's exact VAC note format if it differs.</div>`},

{id:'qa',cat:'Documentation',title:'How QA reviews your work',summary:'What gets checked, and how returns work.',tags:'qa quality passed failed return review',body:`
<p>A QA reviewer re-checks a sample (or all) of your completed accounts. Each gets <b>PASSED</b> or <b>FAILED</b> with a comment.</p>
<ul><li>A FAILED account returns to your queue under <b>Returned by QA</b>. Fix it, then submit again.</li><li>Your <b>My Progress</b> page shows your pass rate and your most common findings, with links to the articles that help.</li></ul>`},

{id:'glossary',cat:'Glossary',title:'Glossary A–Z',summary:'Quick definitions for terms you will hear daily.',tags:'glossary terms definitions npi tin mbi prior auth referral',body:`
<dl>
<dt>270 / 271</dt><dd>Electronic eligibility inquiry (270) and response (271) under HIPAA X12 standards.</dd>
<dt>Availity</dt><dd>A multi-payer portal many commercial and Medicare Advantage payers use for eligibility.</dd>
<dt>Clearinghouse</dt><dd>A service that routes electronic transactions (claims, eligibility) between providers and payers.</dd>
<dt>COB</dt><dd>Coordination of Benefits: rules deciding primary vs. secondary payer.</dd>
<dt>Credentialing</dt><dd>The payer's process of approving a provider to join its network.</dd>
<dt>DOS</dt><dd>Date of service.</dd>
<dt>Effective / term date</dt><dd>The dates coverage starts and ends.</dd>
<dt>INN / OON</dt><dd>In network / out of network.</dd>
<dt>MBI</dt><dd>Medicare Beneficiary Identifier: the 11-character ID on a Medicare card.</dd>
<dt>NPI</dt><dd>National Provider Identifier. Type 1 = individual provider; Type 2 = organization/group.</dd>
<dt>Prior authorization</dt><dd>Payer approval required before a service is performed.</dd>
<dt>Referral</dt><dd>A PCP's order sending the patient to a specialist (common in HMOs).</dd>
<dt>Rendering provider</dt><dd>The clinician who performs the service.</dd>
<dt>TIN / Tax ID</dt><dd>The tax identifier the practice bills under.</dd>
</dl>`}
];

/* ---------------- decision engine (from the Decision Matrix) ---------------- */
function suggest(d, r){
  const need = [];
  if (d.deceased === 'Yes') return {status:'Deceased', tone:'bad', rule:'A date of death is on file. Deceased applies regardless of other answers.'};
  if (d.tebraActive === 'No') return {status:'TEBRA INACTIVE', tone:'bad', rule:'The patient record is inactive in TEBRA. Flag it; no further verification needed.'};
  if (!d.eligibility) need.push('policy active');
  if (d.eligibility === 'No'){
    if (d.selfPay === 'Signed') return {status:'Approved for Self Pay', tone:'warn', rule:'Policy not active + self-pay agreement signed.'};
    if (d.selfPay === 'Requested, not signed') return {status:'No self pay agreement', tone:'bad', rule:'Policy not active + self-pay agreement requested but not signed.'};
    return {status:'Policy Not Active', tone:'bad', rule:'Policy not active on the DOS and no self-pay agreement arranged.'};
  }
  if (d.freqMet === 'No') return {status:'Frequency Requirement Not Met', tone:'warn', rule:'The service\'s frequency limit is not met.'};
  if (isTCM(r) && d.tcmCovered === 'No') return {status:'No TCM Coverage', tone:'warn', rule:'Service is TCM and the plan does not cover it.'};
  if (!d.contracted) need.push('provider network');
  if (!d.hospice) need.push('hospice');
  if (need.length) return {status:null, tone:'', rule:'Answer these to get a suggestion: ' + need.join(', ') + '.'};
  if (d.contracted === 'Yes' && d.hospice === 'No') return {status:'Good to Schedule', tone:'good', rule:'Active policy + provider in network + not in hospice.'};
  if (d.contracted === 'No' && d.hospice === 'No') return {status:'Provider out of Network', tone:'warn', rule:'Active policy + provider out of network + not in hospice.'};
  if (d.contracted === 'No' && d.hospice === 'Yes'){
    if (!d.groupBilling) return {status:null, tone:'', rule:'Answer "Plan allows group billing?" in the Network step.'};
    if (d.groupBilling === 'Yes') return {status:'Ok for Group Billing', tone:'good', rule:'Active policy + provider OON + hospice + plan allows group billing.'};
  }
  return {status:'ON HOLD', tone:'warn', rule:'No row in the Decision Matrix matches these answers. Mark ON HOLD and escalate with a comment.'};
}
const statusTone = s => !s ? '' : /good to schedule|ok for group/i.test(s) ? 'good' : /deceased|not active|no self pay|inactive/i.test(s) ? 'bad' : /hold/i.test(s) ? 'info' : 'warn';
const workTone = w => ({'Completed':'good','In Progress':'info','Escalated':'warn','Assigned':''}[w] || '');

function noteText(d, r){
  const who = S.boot ? S.boot.me.name : '';
  const lines = [
    'ELIGIBILITY VERIFIED ' + new Date().toLocaleDateString('en-US'),
    'Source: ' + (d.source || '—') + (d.reference ? ' | Ref: ' + d.reference : ''),
    'Plan: ' + (d.plan || '—') + ' | Member ID: ' + (d.memberId || '—'),
    'DOS: ' + (d.dos || '—') + ' | Active: ' + (d.eligibility || '—') + ' | INN: ' + (d.contracted || '—') + ' | Hospice: ' + (d.hospice || '—'),
    'Service: ' + (r.tos || '—') + ' | Status: ' + (d.status || '—')
  ];
  if (d.comment) lines.push('Note: ' + d.comment);
  lines.push('— ' + who);
  return lines.join('\n');
}

}

const tile = (label, num, sub, hero) => `<div class="tile${hero ? ' hero' : ''}"><div class="eyebrow">${label}</div><div class="num">${num}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const pill = (txt, tone, plain) => txt ? `<span class="pill ${tone || ''}${plain ? ' plain' : ''}">${esc(txt)}</span>` : '<span class="muted">—</span>';
function bars(entries, emptyMsg){
  if (!entries.length) return `<div class="empty" style="padding:28px">${emptyMsg}</div>`;
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="bars">${entries.map(([l, v, sub]) => `<div class="bar-row"><span class="lab" title="${esc(l)}">${esc(l)}</span><span class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="v">${sub != null ? sub : v}</span></div>`).join('')}</div>`;
}

function sheetPatch(){ const p = {}; SHEET_FIELDS.forEach(k => p[k] = S.draft[k] || ''); return p; }
async function saveDraft(quiet){

async function submitRecord(){
  const d = S.draft, miss = [];
  const short = d.tebraActive === 'No' || d.deceased === 'Yes';
  if (!d.plan && !short) miss.push('Insurance plan');
  if (!d.eligibility && !short) miss.push('Policy active');
  if (!d.status) miss.push('Approval status');
  if (!d.caseName) miss.push('Case name updated');
  if (!d.notes) miss.push('Note added');
  if (d.source && d.source !== 'TEBRA' && d.source !== 'Clearinghouse' && !d.reference) miss.push('Reference #');
  if (miss.length){ toast('Fill in before submitting: ' + miss.join(', '), true); return; }
  if (d.caseName === 'No' || d.notes === 'No'){ toast('Update the case name and note in TEBRA first, then mark them Yes. QA fails accounts without them.', true); return; }
  const fields = sheetPatch(); fields.mode = S.guided ? 'Guided' : 'Express';
  if (short){ fields.plan = fields.plan || 'N/A'; fields.eligibility = fields.eligibility || 'N/A'; }
  try {
    await call('save', {id:S.rec.id, fields, complete:true});
    persistLocal();
    const q = await call('queue', {date:S.date, includeOpen:true}); S.queue = q;
    const next = q.find(x => /^fail/i.test(x.qa) && x.work !== 'Completed') || q.find(x => x.work === 'In Progress') || q.find(x => x.work === 'Assigned');
    if (next && role() === 'Intern'){ toast('Submitted. Opening your next account.'); go('work', {id:next.id}); }
    else { toast('Submitted. Your queue is clear.'); go(role() === 'Intern' ? 'queue' : 'board'); }
  } catch(e){ fail(e); }
}
async function escalateRecord(){
  if (!S.draft.comment){ S.pendingEscalate = false; toast('Add a comment saying what you checked and what is unclear, then escalate.', true); if (S.guided){ S.step = STEPS.length - 1; } renderWork(); setTimeout(() => { const c = $('#f_comment'); if (c) c.focus(); }, 30); return; }

  try { await call('save', {id:S.rec.id, fields, escalate:true}); toast('Escalated to your manager'); go(role() === 'Intern' ? 'queue' : 'board'); } catch(e){ fail(e); }
}

const HEAD_MAP = [['provider', /provider/], ['patient', /patient/], ['dob', /^dob$|birth/], ['tos', /type.*service|service.*type|^tos$|^service$/], ['dos', /^dos$|date.*of.*service/]];
function parseGrid(grid){
  grid = grid.filter(r => r && r.some(c => String(c).trim()));
  const hi = grid.findIndex(r => r.some(c => /patient/i.test(String(c))));
  if (hi === -1) throw new Error('Could not find a header row with "Patient Name". Include the header row: Provider Name, Patient Name, DOB, Type of Service.');
  const heads = grid[hi].map(h => String(h).toLowerCase().replace(/[^a-z ]/g, '').trim());
  const idx = {};
  HEAD_MAP.forEach(([k, re]) => { const i = heads.findIndex(h => re.test(h)); if (i > -1) idx[k] = i; });
  ['provider','patient','dob','tos'].forEach(k => { if (idx[k] == null) throw new Error('Missing column: ' + {provider:'Provider Name', patient:'Patient Name', dob:'DOB', tos:'Type of Service'}[k]); });
  return grid.slice(hi + 1).map(r => ({
    provider:String(r[idx.provider] || '').trim(), patient:String(r[idx.patient] || '').trim(),
    dob:fmtDob(r[idx.dob]), tos:String(r[idx.tos] || '').trim(), dos:idx.dos != null ? fmtDob(r[idx.dos]) : '', internEmail:''
  })).filter(r => r.patient);
}
function fmtDob(v){
  if (v instanceof Date && !isNaN(v)) return (v.getMonth() + 1 + '').padStart(2, '0') + '/' + (v.getDate() + '').padStart(2, '0') + '/' + v.getFullYear();
  if (typeof v === 'number' && v > 1000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return (d.getUTCMonth() + 1 + '').padStart(2, '0') + '/' + (d.getUTCDate() + '').padStart(2, '0') + '/' + d.getUTCFullYear(); }
  return String(v == null ? '' : v).trim();
}

    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
    $('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); });
  }
}
function readFile(f){
  if (!window.XLSX){ toast('The spreadsheet reader did not load. Paste the rows instead.', true); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array', cellDates:true});
      const name = wb.SheetNames.find(n => /verif/i.test(n)) || wb.SheetNames[0];
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
      const rows = parseGrid(grid);
      if (!rows.length) throw new Error('No patient rows found under the header.');
      S.up.rows = rows; S.up.fileName = f.name; viewUpload(); toast(rows.length + ' accounts read from ' + name);
    } catch(e){ fail(e); }
  };
  fr.readAsArrayBuffer(f);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nav],[data-act],[data-open],[data-filter],[data-step],[data-set],[data-tips],[data-kb],[data-kbcat],[data-role],[data-pick],[data-qa],[data-reason]');
  if (!t) return;
  if (t.closest('[data-stop]') && !t.matches('[data-stop]')) return;
  const ds = t.dataset;
  if (ds.nav){ if (ds.nav === 'kb') openKB(); else go(ds.nav); return; }
  if (ds.open){ if (e.target.closest('[data-stop]')) return; go('work', {id:ds.open}); return; }
  if (ds.filter){ S.filter = ds.filter; viewQueue().catch(fail); return; }
  if (ds.step != null){ if (!readOnly()) saveDraft(true); S.step = +ds.step; persistLocal(); renderWork(); window.scrollTo(0, 0); return; }
  if (ds.set){ S.draft[ds.set] = S.draft[ds.set] === ds.val ? '' : ds.val; persistLocal(); renderWork(); return; }
  if (ds.tips){ S.hideTips[ds.tips] = !S.hideTips[ds.tips]; store.set('hideTips', S.hideTips); renderWork(); return; }
  if (ds.kb){ S.kb.id = ds.kb; openKB(ds.kb); return; }
  if (ds.kbcat){ S.kb.cat = ds.kbcat; S.kb.id = null; renderKB(); return; }
  if (ds.role){ Mock.setRole(ds.role); await boot(); return; }
  if (ds.pick){ S.up.pick.has(ds.pick) ? S.up.pick.delete(ds.pick) : S.up.pick.add(ds.pick); viewUpload(); return; }
  if (ds.qa){ S.qaSel = ds.qa; S.qaReason = ''; renderQA(); return; }
  if (ds.reason){ S.qaReason = S.qaReason === ds.reason ? '' : ds.reason; renderQA(); return; }
  switch (ds.act){
    case 'toggle-guided': S.guided = !S.guided; store.set('guided', S.guided); renderSide(); if (S.view === 'work') renderWork(); toast(S.guided ? 'Guided mode on: step-by-step prompts' : 'Express mode: all prompts skipped'); break;
    case 'menu': S.menu = !S.menu; renderSide(); break;
    case 'kb': openKB(); break;
    case 'kb-close': closeKB(); break;
    case 'kb-list': S.kb.id = null; renderKB(); break;
    case 'back': go(role() === 'Intern' ? 'queue' : (S.prevBoard || 'board')); break;
    case 'prev': if (S.step > 0){ saveDraft(true); S.step--; persistLocal(); renderWork(); window.scrollTo(0, 0); } break;
    case 'next': await saveDraft(true); S.step = Math.min(STEPS.length - 1, S.step + 1); persistLocal(); renderWork(); window.scrollTo(0, 0); break;
    case 'save': await saveDraft(false); renderWork(); break;
    case 'submit': await submitRecord(); break;
    case 'escalate': S.pendingEscalate = true; renderWork(); break;
    case 'escalate-no': S.pendingEscalate = false; renderWork(); break;
    case 'escalate-yes': await escalateRecord(); break;
    case 'accept': { const s = suggest(S.draft, S.rec); if (s.status){ S.draft.status = s.status; persistLocal(); renderWork(); toast('Status set to ' + s.status); } break; }
    case 'copy-note': {
      const txt = noteText(S.draft, S.rec);
      try { await navigator.clipboard.writeText(txt); toast('Note copied. Paste it into TEBRA.'); }
      catch(err){ const r = document.createRange(); r.selectNodeContents($('#notebox')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Note selected. Press Ctrl+C to copy.'); }
      break; }
    case 'parse-paste': {
      const txt = $('#paste').value; if (!txt.trim()){ toast('Paste rows from your sheet first.', true); break; }
      try { const rows = parseGrid(txt.split(/\r?\n/).map(l => l.split('\t'))); if (!rows.length) throw new Error('No patient rows found under the header.'); S.up.rows = rows; S.up.fileName = ''; viewUpload(); toast(rows.length + ' accounts read'); } catch(err){ fail(err); }
      break; }
    case 'distribute': { const ps = [...S.up.pick]; S.up.rows.forEach((r, i) => r.internEmail = ps[i % ps.length]); viewUpload(); toast('Split ' + S.up.rows.length + ' accounts between ' + ps.length + ' intern' + (ps.length > 1 ? 's' : '')); break; }
    case 'clear-up': S.up = {rows:[], date:localToday(), pick:new Set(), fileName:''}; viewUpload(); break;
    case 'do-upload': {
      t.disabled = true;
      try { const res = await call('upload', {date:S.up.date, rows:S.up.rows}); toast(res.added + ' accounts added for ' + fmtDay(res.date)); S.date = res.date; S.up = {rows:[], date:localToday(), pick:new Set(), fileName:''}; go('board'); }
      catch(err){ t.disabled = false; fail(err); }
      break; }
    case 'reassign': {
      const to = $('#reassignTo').value; if (!to){ toast('Choose an intern to reassign to.', true); break; }
      try { await call('reassign', {ids:[...S.boardSel], email:to}); toast('Reassigned ' + S.boardSel.size + ' account(s)'); S.boardSel.clear(); viewBoard(); } catch(err){ fail(err); }
      break; }
    case 'qa-pass': case 'qa-fail': {
      const comment = $('#qacomment').value.trim();
      if (ds.act === 'qa-fail' && !comment){ toast('Add a finding so the intern knows what to fix.', true); break; }
      try { await call('qa', {id:S.qaSel, result:ds.act === 'qa-pass' ? 'PASSED' : 'FAILED', comment}); toast(ds.act === 'qa-pass' ? 'Passed' : 'Returned to intern'); S.qaReason = ''; S.qaSel = null; viewQA(); } catch(err){ fail(err); }
      break; }
  }
});

      const f = {}; q.filter(r => /^fail/i.test(r.qa)).forEach(r => f[r.qaComment] = (f[r.qaComment] || 0) + 1);
      const g = d.filter(r => r.mode === 'Guided').length;
      return {completed:d.length, guided:g, express:d.length - g, qaReviewed:q.length, qaPassed:pass.length, topFails:Object.entries(f).map(([reason, count]) => ({reason, count})).sort((x, y) => y.count - x.count)}; }
    throw new Error('Unknown action ' + a);
  }
  return {
    api(a, p){ return new Promise((res, rej) => setTimeout(() => { try { res(clone(handle(a, p))); } catch(e){ rej(e); } }, 120)); },
    setRole(r){ roleNow = r; store.set('demoRole', r); }
  };
})();

/* ---------------- boot ---------------- */
async function boot(){
  setMain('<div class="loading">Loading your workspace…</div>');
  try {
    S.boot = await call('bootstrap', {});
    S.date = S.boot.today || localToday();
    S.queue = []; S.boardSel.clear(); S.filter = 'all';
    if (canQA()) call('queue', {needsQA:true}).then(q => { S.qaCount = q.length; renderSide(); }).catch(() => {});
    go(role() === 'Intern' ? 'queue' : 'board');
  } catch(e){
    $('#side').innerHTML = '<div class="brand"><span class="brand-mark">Verify Desk</span><span class="brand-name">Eligibility<br>&amp; Benefits</span></div>';
    setMain(`<div class="card card-pad" style="max-width:560px;margin-top:40px"><h2>You can't open the Verify Desk yet</h2><p class="muted" style="margin-top:8px">${esc(e.message || e)}</p></div>`);
  }
}
boot();
})();

</script>
